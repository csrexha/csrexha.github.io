name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Render English site
        run: quarto render

      - name: Render German site
        run: quarto render
        working-directory: de

      - name: Install poppler-utils (for PDF text extraction in the audit)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Content audit (CLAUDE.md § 11)
        run: python3 scripts/audit.py

      - name: Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
