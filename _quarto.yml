project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "cv.qmd"
    - "publications.qmd"
    - "blog.qmd"
    - "posts/"

website:
  title: "Chung Shing Rex Ha"
  description: "Biostatistician — clinical trials, health-services research, and applied Bayesian methods."
  site-url: https://csrexha.github.io
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: cv.qmd
        text: CV
      - href: publications.qmd
        text: Publications
      - href: blog.qmd
        text: Blog
    right:
      - text: "DE"
        href: de/index.html
      - icon: github
        href: https://github.com/csrexha
        target: _blank
  page-footer:
    left: "© Chung Shing Rex Ha"
    right:
      - icon: envelope
        href: mailto:hachungshingrex@gmail.com
      - icon: linkedin
        href: https://www.linkedin.com/in/hacsrex/
      - icon: rss
        href: blog.xml

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    smooth-scroll: true
    email-obfuscation: javascript
    link-external-newwindow: true
